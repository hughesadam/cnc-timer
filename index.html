<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CNC Mills Timer</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }

    svg {
      transform: rotate(-90deg);
      margin-top: 20px;
    }

    .circle-bg {
      stroke: #eee;
    }

    .circle {
      transition: stroke 0.3s;
    }

    input {
      width: 80px;
      padding: 5px;
      margin: 5px;
    }

    button {
      padding: 8px 16px;
      margin: 10px;
    }

    #timer {
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>CNC Mills Timer</h1>

<div>
  <label>Timer Duration (sec): <input type="number" id="totalTimeInput" value="" min="1"></label>
  <label>Alert Duration: <input type="number" id="thresholdInput" value="" min="0"></label>
  <br>
  <button onclick="startTimer()">Start Timer</button>
  <button onclick="exportTimer()">Export Timer</button>
</div>

<svg width="200" height="200">
  <circle r="90" cx="100" cy="100" stroke-width="20" fill="none" class="circle-bg" />
  <circle r="90" cx="100" cy="100" stroke-width="20" fill="none" class="circle" />
</svg>

<div id="timer">--:--</div>

<audio id="alertSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  Your browser does not support the audio element.
</audio>

<script>
  const circle = document.querySelector('.circle');
  const timerDisplay = document.getElementById('timer');
  const radius = 90;
  const circumference = 2 * Math.PI * radius;

  circle.style.strokeDasharray = `${circumference}`;
  circle.style.strokeDashoffset = `${circumference}`;
  circle.style.stroke = 'green';

  let timerInterval;

  function startTimer() {
    clearTimeout(timerInterval);

    const totalSeconds = parseInt(document.getElementById('totalTimeInput').value, 10);
    const warningThreshold = parseInt(document.getElementById('thresholdInput').value, 10);

    let timeLeft = totalSeconds;

    function updateTimer() {
      const percent = timeLeft / totalSeconds;
      const offset = circumference * (1 - percent);
      circle.style.strokeDashoffset = offset;

      if (timeLeft <= warningThreshold) {
        circle.style.stroke = 'yellow';

        // Play sound alert exactly once
        if (timeLeft === warningThreshold) {
          document.getElementById('alertSound').play();
        }
      } else {
        circle.style.stroke = 'green';
      }

      const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const seconds = String(timeLeft % 60).padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;

      if (timeLeft > 0) {
        timeLeft--;
        timerInterval = setTimeout(updateTimer, 1000);
      } else {
        circle.style.stroke = 'red';
        timerDisplay.textContent = "Time's up!";
      }
    }

    circle.style.strokeDashoffset = circumference;
    circle.style.stroke = 'green';
    updateTimer();
  }

  function exportTimer() {
  const clone = document.documentElement.cloneNode(true);

  // Fix inputs — use querySelector instead of getElementById on the clone
  const totalTimeVal = document.getElementById('totalTimeInput').value;
  const thresholdVal = document.getElementById('thresholdInput').value;

  const cloneTotalInput = clone.querySelector('#totalTimeInput');
  const cloneThresholdInput = clone.querySelector('#thresholdInput');

  if (cloneTotalInput) cloneTotalInput.setAttribute('value', totalTimeVal);
  if (cloneThresholdInput) cloneThresholdInput.setAttribute('value', thresholdVal);

  // Update timer text
  const cloneTimer = clone.querySelector('#timer');
  if (cloneTimer) {
    cloneTimer.textContent = timerDisplay.textContent;
  }

  // Inline SVG style
  const computed = getComputedStyle(circle);
  const stroke = computed.stroke;
  const strokeWidth = computed.strokeWidth;
  const dasharray = computed.strokeDasharray;
  const dashoffset = computed.strokeDashoffset;

  const cloneCircle = clone.querySelector('.circle');
  if (cloneCircle) {
    cloneCircle.removeAttribute('class');
    cloneCircle.setAttribute('stroke', stroke);
    cloneCircle.setAttribute('stroke-width', strokeWidth);
    cloneCircle.setAttribute('stroke-dasharray', dasharray);
    cloneCircle.setAttribute('stroke-dashoffset', dashoffset);
    cloneCircle.setAttribute('fill', 'none');
  }

  // Remove all scripts so it's static
  clone.querySelectorAll('script').forEach(s => s.remove());

  // Serialize HTML
  const finalHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([finalHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);

  // Create a temporary anchor to trigger the download
  const a = document.createElement('a');
  a.href = url;
  a.download = `cnc-timer-${Date.now()}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  // Revoke the blob URL
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

</script>

</body>
</html>
